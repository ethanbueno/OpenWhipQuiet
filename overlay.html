<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; cursor: none; }
  html, body { overflow: hidden; background: transparent; width: 100%; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>

// ══════════════════════════════════════════════════════════════════════════════
//  PHYSICS SETTINGS — TWEAK EVERYTHING HERE
// ══════════════════════════════════════════════════════════════════════════════
const P = {
  // Time. The whip runs on its own clock, so it moves the same on a 60 Hz screen as on
  // a 144 Hz one. One tick is 1/60 s; settings described as "per tick" use that unit.
  substeps:       4,      // physics steps per tick (more = smoother, stiffer fast swings)
  timeScale:      1,      // overall speed of the whip (1 = normal, 2 = twice as fast)
  maxFrameMs:     50,     // after a stall, simulate at most this much time in one frame

  // Rope structure
  segments:       28,     // number of chain links
  segmentLength:  25,     // base length of each link (px)
  taper:          0.6,   // tip segment is this fraction of base length
  tipMass:        0.15,   // weight of the tip compared with the handle end (1 = same weight all along)

  // Physics
  gravity:        1.2,   // normal gravity (px per tick, per tick)
  dropGravity:    0.95,    // gravity when dropping/despawning
  airDragAlong:   0.99,  // speed kept per tick sliding along the whip's own length (1 = no loss)
  airDragAcross:  0.96,  // speed kept per tick moving sideways through the air
  constraintIters: 5,     // solver passes per substep; higher = stiffer chain
  maxStretchRatio: 1.2,  // hard cap for per-link stretch during fast whips

  // Dynamic handle aim (the handle tilts toward where the mouse is moving)
  baseTargetAngle: -1.12, // radians, default "up-right" resting direction
  handleAimByMouseX: 0.4, // horizontal mouse movement (px per tick) influence on target angle
  handleAimByMouseY: 0.2, // vertical mouse movement (px per tick) influence on target angle
  handleAimClamp:    2.0,  // max radians target can deviate from base angle
  handleTurnRate:    0.06, // fraction of the way the handle turns toward its target each tick
  basePoseSegments: 2,    // how many early segments are strongly guided
  basePoseStiffStart: 0.9, // stiffness near handle
  basePoseStiffEnd:   0.8, // stiffness near end of guided region

  // Elastic bend limits by chain position (handle stiff, tip floppy)
  handleMaxBendDeg: 16,   // max angle between links near handle
  tipMaxBendDeg:   130,   // max angle between links near tip
  bendRigidityStart: 0.8, // correction strength near handle
  bendRigidityEnd:   0.12, // correction strength near tip

  // Screen-edge slap
  wallBounce:      0.42,   // velocity retained after wall hit
  wallFriction:    0.86,   // tangential damping on wall hit

  // Crack detection. A real whip cracks when the tip snaps: it whips out fast, then
  // stops or reverses suddenly. Speeds are the tip's own motion, minus the handle's,
  // so dragging the whole whip around doesn't crack it.
  crackSpeed:      150,   // tip speed (px per tick) a swing must reach before it can crack
  crackSnapDrop:   0.6,   // crack fires when tip speed falls below this fraction of the swing's peak
  crackRearmRatio: 0.5,   // tip must slow below crackSpeed * this before the next swing can crack
  crackCooldownMs: 120,   // min ms between cracks
  firstCrackGraceMs: 350, // no crack until this long after spawn
  crackFullSpeed:  320,   // swing peak speed that gives a full-volume crack

  // Swish: a quiet whoosh while the whip moves through the air
  swishVolume:     0.18,  // 0 turns it off
  swishMinSpeed:   40,    // tip speed where the whoosh starts
  swishMaxSpeed:   300,   // tip speed where the whoosh is loudest

  // Visuals
  lineWidthHandle: 7,      // rope thickness near handle
  lineWidthTip:    5,      // rope thickness near tip
  outlineWidth:   3,      // white halo on each side of the stroke (approx px)
  handleExtraWidth: 5,    // added core + outline thickness on first handleThickSegments links only
  handleThickSegments: 2, // how many links from the handle get handleExtraWidth
  bgAlpha:        0.011,  // barely-visible bg so window captures mouse events

  // Initial arc shape
  arcWidth:       260,    // how far right the arc extends from mouse
  arcHeight:      185,    // how high the arc goes above mouse
};

// ══════════════════════════════════════════════════════════════════════════════

const TICK_HZ = 60; // ticks per second of simulated time

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let mouseX = 0, mouseY = 0;
let whip = null;
let dropping = false;
let handleAngle = P.baseTargetAngle;

// Simulation clock
let simTime = 0;                        // simulated seconds since the whip spawned
let accumulator = 0;                    // simulated time owed but not yet stepped
let renderAlpha = 1;                    // where the drawn frame sits between the last two steps
let lastFrameMs = null;                 // timestamp of the previous animation frame
let handleX = 0, handleY = 0;           // handle position at the last physics step
let frameMouseX = 0, frameMouseY = 0;   // mouse position at the previous animation frame

// Per-point data, rebuilt on spawn
let invMass = [];                       // 1 / weight of each point
let dirX = [], dirY = [];               // direction of the whip at each point
let drawPts = [];                       // interpolated points for drawing

// Crack detection
let lastCrackTime = -Infinity;
let crackArmed = false;
let swingPeak = 0;

const WHIP_CRACK_SOUNDS = ['sounds/A.mp3', 'sounds/B.mp3', 'sounds/C.mp3', 'sounds/D.mp3', 'sounds/E.mp3'];

document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
document.addEventListener('mousedown', () => {
  if (whip && !dropping) dropping = true;
});

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ── Whip creation ───────────────────────────────────────────────────────────
function spawnWhip(mx, my) {
  dropping = false;
  simTime = 0;
  accumulator = 0;
  renderAlpha = 1;
  lastFrameMs = null;
  lastCrackTime = -Infinity;
  crackArmed = false;
  swingPeak = 0;
  const pts = [];
  invMass = [];
  dirX = [];
  dirY = [];
  drawPts = [];
  for (let i = 0; i < P.segments; i++) {
    const t = i / (P.segments - 1);
    // Nice upward arc from handle (mouse) to tip
    const x = mx + t * P.arcWidth;
    const y = my - Math.sin(t * Math.PI * 0.75) * P.arcHeight;
    pts.push({ x, y, px: x, py: y, ox: x, oy: y });
    // A whip tapers: each point is lighter than the one before it.
    invMass.push(1 / lerp(1, P.tipMass, t));
    dirX.push(1);
    dirY.push(0);
    drawPts.push({ x, y });
  }
  return pts;
}

function segLen(i) {
  const t = i / (P.segments - 1);
  return P.segmentLength * (1 - t * (1 - P.taper));
}

/** Point on Catmull–Rom spline (extrapolated ends) for index i in `pts`. */
function catmullPoint(pts, i) {
  const n = pts.length;
  if (n === 0) return { x: 0, y: 0 };
  if (i < 0) {
    if (n >= 2) {
      return { x: 2 * pts[0].x - pts[1].x, y: 2 * pts[0].y - pts[1].y };
    }
    return { x: pts[0].x, y: pts[0].y };
  }
  if (i >= n) {
    if (n >= 2) {
      const a = pts[n - 2], b = pts[n - 1];
      return { x: 2 * b.x - a.x, y: 2 * b.y - a.y };
    }
    return { x: pts[n - 1].x, y: pts[n - 1].y };
  }
  return pts[i];
}

/**
 * Cubic Bézier from p1→p2 matching uniform Catmull–Rom through p0,p1,p2,p3.
 * Control points: C1 = p1 + (p2-p0)/6, C2 = p2 - (p3-p1)/6.
 */
function whipSegmentBezier(pts, i) {
  const p0 = catmullPoint(pts, i - 1);
  const p1 = pts[i];
  const p2 = pts[i + 1];
  const p3 = catmullPoint(pts, i + 2);
  return {
    cp1x: p1.x + (p2.x - p0.x) / 6,
    cp1y: p1.y + (p2.y - p0.y) / 6,
    cp2x: p2.x - (p3.x - p1.x) / 6,
    cp2y: p2.y - (p3.y - p1.y) / 6,
    x2: p2.x,
    y2: p2.y,
  };
}
const wrapPi = a => {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
};

/** `intensity` 0..1: harder swings crack louder and a touch higher. */
function playCrackSound(intensity) {
  if (!WHIP_CRACK_SOUNDS.length) return;
  const src = WHIP_CRACK_SOUNDS[Math.floor(Math.random() * WHIP_CRACK_SOUNDS.length)];
  const a = new Audio(src);
  a.volume = lerp(0.35, 1, intensity);
  a.preservesPitch = false;
  a.playbackRate = lerp(0.94, 1.06, intensity) * lerp(0.97, 1.03, Math.random());
  a.play().catch(() => {});
}

// ── Swish (synthesised: filtered noise whose loudness follows tip speed) ────
let swish = null;

function startSwish() {
  if (swish || !P.swishVolume) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const ac = new AC();
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 0.9;
    filter.frequency.value = 500;
    const gain = ac.createGain();
    gain.gain.value = 0;
    src.connect(filter).connect(gain).connect(ac.destination);
    src.start();
    swish = { ac, filter, gain };
  } catch (e) {
    swish = null;
  }
}

function setSwish(speed) {
  if (!swish) return;
  const t = clamp((speed - P.swishMinSpeed) / (P.swishMaxSpeed - P.swishMinSpeed), 0, 1);
  const now = swish.ac.currentTime;
  swish.gain.gain.setTargetAtTime(P.swishVolume * t * t, now, 0.03);
  swish.filter.frequency.setTargetAtTime(lerp(400, 2600, t), now, 0.03);
}

/**
 * Fires the crack at the snap: once a swing has got fast enough, the crack plays on
 * the step the tip's speed falls away from its peak. `speed` is in px per tick.
 */
function detectCrack(speed) {
  const now = simTime * 1000;
  if (dropping || now < P.firstCrackGraceMs) {
    crackArmed = false;
    swingPeak = 0;
    return;
  }
  swingPeak = Math.max(swingPeak, speed);
  if (
    crackArmed &&
    swingPeak >= P.crackSpeed &&
    speed < swingPeak * P.crackSnapDrop &&
    now - lastCrackTime > P.crackCooldownMs
  ) {
    crackArmed = false;
    lastCrackTime = now;
    const t = (swingPeak - P.crackSpeed) / (P.crackFullSpeed - P.crackSpeed);
    playCrackSound(clamp(t, 0, 1));
  }
  // Once the tip has slowed right down, the next swing can crack.
  if (speed < P.crackSpeed * P.crackRearmRatio) {
    crackArmed = true;
    swingPeak = 0;
  }
}

/** Turns the handle toward where the mouse is heading. `mvx`, `mvy` are px per tick. */
function updateHandleAim(mvx, mvy, S) {
  if (dropping) return;
  const delta = clamp(
    mvx * P.handleAimByMouseX + mvy * P.handleAimByMouseY,
    -P.handleAimClamp,
    P.handleAimClamp
  );
  const target = P.baseTargetAngle + delta;
  const err = wrapPi(target - handleAngle);
  handleAngle = wrapPi(handleAngle + err * (1 - Math.pow(1 - P.handleTurnRate, 1 / S)));
}

function applyBasePose() {
  if (!whip || dropping) return;
  const dx = Math.cos(handleAngle);
  const dy = Math.sin(handleAngle);
  const guided = Math.min(P.basePoseSegments, whip.length - 1);
  for (let i = 1; i <= guided; i++) {
    const t = (i - 1) / Math.max(guided - 1, 1);
    const stiff = lerp(P.basePoseStiffStart, P.basePoseStiffEnd, t);
    const prev = whip[i - 1];
    const p = whip[i];
    const targetLen = segLen(i - 1);
    const tx = prev.x + dx * targetLen;
    const ty = prev.y + dy * targetLen;
    p.x = lerp(p.x, tx, stiff);
    p.y = lerp(p.y, ty, stiff);
  }
}

function applyBendLimits() {
  if (!whip || whip.length < 3) return;
  for (let i = 1; i < whip.length - 1; i++) {
    const a = whip[i - 1];
    const b = whip[i];
    const c = whip[i + 1];

    const v1x = a.x - b.x;
    const v1y = a.y - b.y;
    const v2x = c.x - b.x;
    const v2y = c.y - b.y;
    const l1 = Math.hypot(v1x, v1y) || 0.0001;
    const l2 = Math.hypot(v2x, v2y) || 0.0001;
    const n1x = v1x / l1, n1y = v1y / l1;
    const n2x = v2x / l2, n2y = v2y / l2;

    const dot = clamp(n1x * n2x + n1y * n2y, -1, 1);
    const angle = Math.acos(dot);
    const t = i / (whip.length - 2);
    const maxBend = lerp(P.handleMaxBendDeg, P.tipMaxBendDeg, t) * Math.PI / 180;
    const bend = Math.PI - angle; // bend away from a straight line
    if (bend <= maxBend) continue;

    // Clamp to max bend while preserving side/sign of the bend.
    const cross = n1x * n2y - n1y * n2x;
    const sign = cross >= 0 ? 1 : -1;
    const targetAngle = Math.PI - maxBend;
    const targetA = Math.atan2(n1y, n1x) + sign * targetAngle;
    const tx = b.x + Math.cos(targetA) * l2;
    const ty = b.y + Math.sin(targetA) * l2;
    const rigidity = lerp(P.bendRigidityStart, P.bendRigidityEnd, t);

    c.x = lerp(c.x, tx, rigidity);
    c.y = lerp(c.y, ty, rigidity);
  }
}

function capSegmentStretch() {
  if (!whip || whip.length < 2) return;
  for (let i = 0; i < whip.length - 1; i++) {
    const a = whip[i];
    const b = whip[i + 1];
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const maxLen = segLen(i) * P.maxStretchRatio;
    if (dist <= maxLen) continue;
    const k = maxLen / dist;
    b.x = a.x + dx * k;
    b.y = a.y + dy * k;
  }
}

function applyWallCollisions() {
  if (!whip || dropping) return; // disable collisions while dropping
  const start = 1; // keep pinned handle untouched
  for (let i = start; i < whip.length; i++) {
    const p = whip[i];
    let vx = p.x - p.px;
    let vy = p.y - p.py;
    let hit = false;

    if (p.x < 0) {
      p.x = 0;
      if (vx < 0) vx = -vx * P.wallBounce;
      vy *= P.wallFriction;
      hit = true;
    } else if (p.x > W) {
      p.x = W;
      if (vx > 0) vx = -vx * P.wallBounce;
      vy *= P.wallFriction;
      hit = true;
    }

    if (p.y < 0) {
      p.y = 0;
      if (vy < 0) vy = -vy * P.wallBounce;
      vx *= P.wallFriction;
      hit = true;
    } else if (p.y > H) {
      p.y = H;
      if (vy > 0) vy = -vy * P.wallBounce;
      vx *= P.wallFriction;
      hit = true;
    }

    if (hit) {
      p.px = p.x - vx;
      p.py = p.y - vy;
    }
  }
}

// ── Physics step ────────────────────────────────────────────────────────────

/** Applies air drag and gravity, then moves every free point (Verlet). */
function integrate(S) {
  const n = whip.length;
  const g = (dropping ? P.dropGravity : P.gravity) / (S * S);
  const along = Math.pow(P.airDragAlong, 1 / S);
  const across = Math.pow(P.airDragAcross, 1 / S);
  const start = dropping ? 0 : 1; // if dropping, handle is free too

  // Direction the whip runs at each point, measured before anything moves.
  for (let i = 0; i < n; i++) {
    const a = whip[Math.max(i - 1, 0)], b = whip[Math.min(i + 1, n - 1)];
    const tx = b.x - a.x, ty = b.y - a.y;
    const len = Math.hypot(tx, ty) || 1;
    dirX[i] = tx / len;
    dirY[i] = ty / len;
  }

  // A rope slips easily through the air along its own length but is slowed moving
  // sideways, which is what lets a loop roll down a whip instead of just collapsing.
  for (let i = start; i < n; i++) {
    const p = whip[i];
    const vx = p.x - p.px, vy = p.y - p.py;
    const vAlong = vx * dirX[i] + vy * dirY[i];
    const ax = vAlong * dirX[i], ay = vAlong * dirY[i];
    p.px = p.x;
    p.py = p.y;
    p.x += ax * along + (vx - ax) * across;
    p.y += ay * along + (vy - ay) * across + g;
  }
}

/** Pulls each link back to its length. The lighter end of a link moves more. */
function solveLinks() {
  for (let i = 0; i < whip.length - 1; i++) {
    const a = whip[i], b = whip[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
    const wa = i === 0 && !dropping ? 0 : invMass[i]; // a held handle doesn't give
    const wb = invMass[i + 1];
    const k = (dist - segLen(i)) / dist / (wa + wb);
    a.x += dx * k * wa; a.y += dy * k * wa;
    b.x -= dx * k * wb; b.y -= dy * k * wb;
  }
}

/** One physics step, with the handle held at (hx, hy). `S` is steps per tick. */
function substep(hx, hy, S) {
  const n = whip.length;
  const tip = whip[n - 1];
  const hdx = dropping ? 0 : hx - handleX;
  const hdy = dropping ? 0 : hy - handleY;
  handleX = hx;
  handleY = hy;
  updateHandleAim(hdx * S, hdy * S, S);

  for (let i = 0; i < n; i++) {
    whip[i].ox = whip[i].x;
    whip[i].oy = whip[i].y;
  }
  integrate(S);

  // Pin handle to mouse
  if (!dropping) {
    whip[0].x = hx;
    whip[0].y = hy;
    whip[0].px = hx;
    whip[0].py = hy;
  }

  // Prevent rubber-band stretching spikes before constraints.
  capSegmentStretch();
  applyWallCollisions();

  // Keep early whip segments posed upward from handle.
  applyBasePose();

  for (let iter = 0; iter < P.constraintIters; iter++) {
    solveLinks();
    // Clamp bend angle per joint; near handle = stiffer, near tip = floppier.
    applyBendLimits();
    if (!dropping) applyBasePose();
    capSegmentStretch();
    applyWallCollisions();
  }

  // Tip speed relative to the handle (px per tick), for the crack and the swish.
  const tipSpeed = Math.hypot(tip.x - tip.px - hdx, tip.y - tip.py - hdy) * S;
  detectCrack(tipSpeed);
  setSwish(dropping ? 0 : tipSpeed);
  simTime += 1 / (TICK_HZ * S);

  // If dropping, check if everything fell off screen
  if (dropping && whip.every(p => p.y > H + 60)) {
    whip = null;
    dropping = false;
    window.bridge.hideOverlay();
  }
}

/**
 * Advances the simulation by `elapsed` seconds of real time, in fixed steps. The handle
 * follows a straight line from where the mouse was last frame to where it is now, so a
 * fast flick is fed to the whip smoothly instead of as one jump per frame.
 */
function advance(elapsed) {
  if (!whip) return;
  const S = Math.max(1, Math.round(P.substeps));
  const dt = 1 / (TICK_HZ * S);
  const span = elapsed * P.timeScale;
  const fromX = frameMouseX, fromY = frameMouseY;
  frameMouseX = mouseX;
  frameMouseY = mouseY;
  const owed = accumulator;
  accumulator += span;
  let k = 0;
  while (whip && accumulator >= dt) {
    accumulator -= dt;
    k++;
    const u = span > 0 ? clamp((k * dt - owed) / span, 0, 1) : 1;
    substep(lerp(fromX, mouseX, u), lerp(fromY, mouseY, u), S);
  }
  renderAlpha = clamp(accumulator / dt, 0, 1);
}

// ── Rendering ───────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Near-invisible fill so the window captures mouse events on Windows
  ctx.fillStyle = `rgba(0,0,0,${P.bgAlpha})`;
  ctx.fillRect(0, 0, W, H);

  if (!whip) return;

  // Draw the whip part-way between its last two physics steps, so it moves smoothly
  // whatever the screen's refresh rate.
  const pts = drawPts;
  for (let i = 0; i < whip.length; i++) {
    pts[i].x = lerp(whip[i].ox, whip[i].x, renderAlpha);
    pts[i].y = lerp(whip[i].oy, whip[i].y, renderAlpha);
  }

  // White: thin halo on full spline, then extra thickness only over handle links.
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';
  if (pts.length >= 2) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 0; i < pts.length - 1; i++) {
      const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(pts, i);
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
    }
    ctx.lineWidth = P.lineWidthTip + P.outlineWidth * 2;
    ctx.stroke();

    const thickLinks = Math.min(P.handleThickSegments, pts.length - 1);
    if (thickLinks > 0 && P.handleExtraWidth > 0) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 0; i < thickLinks; i++) {
        const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(pts, i);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
      }
      ctx.lineWidth =
        P.lineWidthHandle + P.handleExtraWidth + P.outlineWidth * 2;
      ctx.stroke();
    }
  }

  ctx.strokeStyle = '#111';
  for (let i = 0; i < pts.length - 1; i++) {
    const t = i / Math.max(1, pts.length - 2);
    const extra = i < P.handleThickSegments ? P.handleExtraWidth : 0;
    ctx.lineWidth = lerp(P.lineWidthHandle, P.lineWidthTip, t) + extra;
    const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(pts, i);
    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
    ctx.stroke();
  }
}

// ── Main loop ───────────────────────────────────────────────────────────────
function frame(nowMs) {
  if (whip) {
    const elapsedMs = lastFrameMs === null ? 0 : Math.min(nowMs - lastFrameMs, P.maxFrameMs);
    lastFrameMs = nowMs;
    advance(Math.max(elapsedMs, 0) / 1000);
  } else {
    lastFrameMs = null;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── IPC from main process ───────────────────────────────────────────────────
window.bridge.onSpawnWhip(() => {
  whip = spawnWhip(mouseX || W / 2, mouseY || H / 2);
  dropping = false;
  handleX = frameMouseX = mouseX;
  handleY = frameMouseY = mouseY;
  handleAngle = P.baseTargetAngle;
  startSwish();
  if (swish && swish.ac.state === 'suspended') swish.ac.resume().catch(() => {});
});

window.bridge.onDropWhip(() => {
  if (whip && !dropping) dropping = true;
});

</script>
